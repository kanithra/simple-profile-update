<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    
    <p class="h4 text-center mt-3 p-3 bg-secondary text-white">Welcome</p>

    <div class="d-flex justify-content-center">
    <button class="btn btn-primary m-5"  onclick="showForm()">Click here to update your details</button>
   </div>
       
   <div class="card " style="width: 600px;display: none;margin-left: 350px;" id="head">
        <div class="card-header text-center">Update your details</div>
            <div class="card-body">
                <form onsubmit="submitAll(event)">
                    <table class="table table-sm table-responsive-sm table-striped table-hover table-borderless">
                        <tr>
                            <td>Name</td>
                            <td><input type="text" id="name" required></td>
                        </tr>
                        <tr>
                            <td>Address</td>
                            <td><input type="text" id="address" required></td>
                        </tr>
                        <tr>
                            <td>DOB</td>
                            <td><input type="date" id="date" required></td>
                        </tr>
                        
                        <tr>
                            <td>District</td>
                            <td><input type="text" id="district" required></td>
                        </tr>
                        <tr>
                            <td>Pincode</td>
                            <td ><input type="number" id="num" required></td>
                        </tr>
                       
                </table>
                <button class="btn btn-success" onclick="submitAll()">Submit</button>
                </form>
            </div>
    </div>
   <div class="card" id="successCard" style="width: 600px;display: none;margin-left: 350px;">
    <div class="card-header text-center">Succesfully updated</div>
    <div class="card-body">
        <table class="table table-borderless table-responsive-sm table-striped" >
            <tr>
                <td id="FormValue"></td>
            </tr>
            <tr>
                <td id="FormValue1"></td>
            </tr>
            <tr>
                <td id="FormValue2"></td>
            </tr>
            <tr>
                <td id="FormValue3"></td>
            </tr>
            <tr>
                <td id="FormValue4"></td>
            </tr>
        </table>
    </div>
    
   </div>
        
        <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="./script.js"></script>
    </body>
    </html>
